<title>Kingshot Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas carries the game; the DOM holds the HUD strip, the wave button
   and the title / result panels. Single committed look (a sunlit low-poly map), same in any theme. */
:root {
  --grass: #2fb46c;
  --ink: #141a26;
  --panel: rgba(20, 26, 38, 0.94);
  --gold: #f9c733;
  --red: #dc2f2f;
  --green: #2aa552;
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.78);
  --font-display: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--grass); color: var(--text); font-family: var(--font-display);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  padding: 0 14px; pointer-events: none; font-weight: 900; font-size: 20px;
  text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 12px rgba(0,0,0,.25); font-variant-numeric: tabular-nums;
  transition: opacity .35s;
}
#hud.hide { opacity: 0; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: rgba(0,0,0,.38); border-radius: 999px; padding: 6px 12px 6px 8px; }
.pill svg { width: 22px; height: 22px; flex: none; }
#coins { color: var(--gold); }
#hudMid { text-align: center; justify-self: center; }
#dayLabel { font-size: 18px; letter-spacing: .06em; }
#timer { font-size: 15px; color: var(--text-dim); margin-top: 2px; }
#timer.night { color: #ffb4a8; }
#hudRight { justify-self: end; }
#keepBar { width: 84px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.45); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
#keepFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b5e, #f9c733 70%, #4cc57f); transition: width .25s; }

#waveBtn {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  appearance: none; border: 3px solid rgba(255,255,255,.85); border-radius: 16px;
  background: #d94c3d; color: #fff; font: inherit; font-weight: 900; font-size: 18px; letter-spacing: .04em;
  padding: 12px 22px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.3); display: flex; align-items: center; gap: 8px;
  transition: opacity .3s;
}
#waveBtn svg { width: 20px; height: 20px; }
#waveBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
#waveBtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#hint {
  position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  text-align: center; font-weight: 800; font-size: 17px; pointer-events: none; line-height: 1.35;
  text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.3); opacity: 0; transition: opacity .3s;
}
#hint.show { opacity: 1; }
#banner {
  position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none;
  font-weight: 900; font-size: clamp(44px, 12vw, 84px); letter-spacing: .04em; color: var(--gold);
  text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 30px rgba(0,0,0,.35);
  opacity: 0; transform: scale(.7); transition: opacity .35s, transform .45s cubic-bezier(.2,1.4,.4,1);
}
#banner.show { opacity: 1; transform: scale(1); }
#banner.night { color: #c9d4ff; }
#banner.win { color: var(--gold); }
#banner small { display: block; font-size: .36em; letter-spacing: .12em; color: var(--text-dim); margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { #banner { transition: opacity .2s; transform: none; } }

#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); padding: 16px; }
.panel {
  width: min(340px, 100%); box-sizing: border-box; background: var(--panel); border: 4px solid var(--gold); border-radius: 24px;
  padding: 28px 22px 24px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.45);
}
.panel.lost { border-color: var(--red); }
.panel h1 { margin: 0 0 4px; font-size: 48px; font-weight: 900; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.5); text-wrap: balance; }
.panel.lost h1 { color: #ff6b5e; }
.panel .sub { margin: 0 0 16px; font-weight: 800; font-size: 20px; }
.panel .meta { margin: 0 0 18px; font-size: 16px; font-weight: 700; color: var(--text-dim); }
.panel .reward { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 18px; }
.panel .reward svg { width: 24px; height: 24px; }
.btn {
  appearance: none; border: 3px solid rgba(255,255,255,.85); border-radius: 16px; background: var(--green); color: #fff; font: inherit;
  font-weight: 900; font-size: 22px; letter-spacing: .03em; padding: 14px 32px; min-width: 220px; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.3); animation: pulse 1.1s ease-in-out infinite;
}
.btn.retry { background: #d94c3d; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.help { margin: 18px 0 0; font-size: 14px; font-weight: 700; color: var(--text-dim); line-height: 1.5; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
</style>

<canvas id="game" aria-label="Kingshot keep defense"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="coinIcon"><circle cx="10" cy="10" r="10" fill="#cc8c1a"/><circle cx="10" cy="10" r="8" fill="#f9c733"/><circle cx="10" cy="10" r="4" fill="#cc8c1a"/><circle cx="10" cy="10" r="2.4" fill="#f9c733"/></g>
    <g id="keepIcon"><rect x="2" y="9" width="24" height="16" rx="2" fill="#9aa2b0"/><rect x="2" y="5" width="5" height="6" fill="#c3c9d4"/><rect x="11.5" y="5" width="5" height="6" fill="#c3c9d4"/><rect x="21" y="5" width="5" height="6" fill="#c3c9d4"/><rect x="11" y="15" width="6" height="10" rx="3" fill="#2b2f3a"/></g>
  </defs>
</svg>
<div id="hud" class="hide">
  <div><span class="pill" id="coins"><svg viewBox="0 0 20 20"><use href="#coinIcon"/></svg><span id="coinCount">0</span></span></div>
  <div id="hudMid"><div id="dayLabel">DAY 1</div><div id="timer"></div></div>
  <div id="hudRight"><span class="pill"><svg viewBox="0 0 28 28"><use href="#keepIcon"/></svg><span id="keepBar"><span id="keepFill" style="display:block"></span></span></span></div>
</div>
<button id="waveBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-9 9-6-6z"/><path d="M4 20l3-3"/><path d="M15 13l2 2"/></svg><span>CALL THE NIGHT</span></button>
<div id="hint" aria-live="polite"></div>
<div id="banner" aria-live="polite"></div>
<div id="overlay">
  <div class="panel" id="panel" role="dialog" aria-labelledby="panelTitle">
    <h1 id="panelTitle">KINGSHOT</h1>
    <p class="sub" id="panelSub">Hold the Keep</p>
    <p class="meta" id="panelMeta">Level 1 · Best 1</p>
    <div class="reward" id="panelReward" hidden><svg viewBox="0 0 20 20"><use href="#coinIcon"/></svg><span id="panelRewardText">+0</span></div>
    <button class="btn" id="panelButton" type="button">TAP TO PLAY</button>
    <p class="help" id="panelHelp">Drag anywhere to march. Your gold follows you.<br>Stand on a price sign to build. Hold the road at night.</p>
  </div>
</div>

<script>
'use strict';
// =====================================================================================
//  Core rules — the Kingshot opening as it actually plays: a Thronefall-style loop.
//  Day: ride around, pick up coins, pay at build sites. Night: raiders march up the road at
//  the keep; towers, walls, your soldiers and the king hold them off. Pure logic, no drawing.
// =====================================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = (r, lo, hi) => lo + (hi - lo) * r();
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const lerp = (a, b, t) => a + (b - a) * t;

// ---- Track geometry: the road the raiders come up ----------------------------------------
class Track {
  constructor(seed, requiredLength, opts = {}) {
    const halfWidth = opts.halfWidth ?? 3, step = opts.step ?? 7, leadIn = opts.leadIn ?? 12;
    const tail = opts.tail ?? 16, straight = opts.straight ?? 1, per = opts.samplesPerSegment ?? 16;
    this.halfWidth = halfWidth; this.leadIn = leadIn;
    const r = mulberry32(seed ^ 0xC0FFEE);
    const segs = Math.ceil((leadIn + requiredLength + tail) / step) + 1;
    const pts = [[0, -step], [0, 0]];
    let p = [0, 0], heading = Math.PI / 2;
    const up = Math.PI / 2;
    for (let i = 0; i < segs; i++) {
      if (i >= straight) {
        const bias = (up - heading) * 0.35;
        heading = clamp(heading + rnd(r, -0.5, 0.5) + bias, up - 0.95, up + 0.95);
      }
      p = [p[0] + Math.cos(heading) * step, p[1] + Math.sin(heading) * step];
      pts.push(p);
    }
    pts.push([p[0] + Math.cos(heading) * step, p[1] + Math.sin(heading) * step]);
    const pos = [], tan = [], dst = [];
    let run = 0;
    for (let seg = 1; seg <= pts.length - 3; seg++) {
      const [p0, p1, p2, p3] = [pts[seg - 1], pts[seg], pts[seg + 1], pts[seg + 2]];
      const steps = seg === pts.length - 3 ? per + 1 : per;
      for (let k = 0; k < steps; k++) {
        const t = k / per, t2 = t * t, t3 = t2 * t, out = [0, 0], dir = [0, 0];
        for (let d = 0; d < 2; d++) {
          const a = 2 * p1[d], b = p2[d] - p0[d], c = 2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d], e = 3 * (p1[d] - p2[d]) - p0[d] + p3[d];
          out[d] = 0.5 * (a + b * t + c * t2 + e * t3); dir[d] = 0.5 * (b + 2 * c * t + 3 * e * t2);
        }
        if (pos.length) run += Math.hypot(out[0] - pos[pos.length - 1][0], out[1] - pos[pos.length - 1][1]);
        const len = Math.hypot(dir[0], dir[1]) || 1;
        pos.push(out); tan.push([dir[0] / len, dir[1] / len]); dst.push(run);
      }
    }
    this.pos = pos; this.tan = tan; this.dist = dst; this.total = run;
  }
  locate(s) {
    const d = clamp(s + this.leadIn, 0, this.total);
    let lo = 0, hi = this.dist.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (this.dist[mid] <= d) lo = mid; else hi = mid; }
    const span = this.dist[hi] - this.dist[lo];
    return [lo, span > 1e-9 ? clamp((d - this.dist[lo]) / span, 0, 1) : 0];
  }
  position(s) {
    const [i, f] = this.locate(s), a = this.pos[i], b = this.pos[Math.min(i + 1, this.pos.length - 1)];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  tangent(s) {
    const [i, f] = this.locate(s), a = this.tan[i], b = this.tan[Math.min(i + 1, this.tan.length - 1)];
    const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f, l = Math.hypot(x, y) || 1;
    return [x / l, y / l];
  }
  point(s, x) {
    const p = this.position(s), t = this.tangent(s);
    return [p[0] + t[1] * x * this.halfWidth, p[1] - t[0] * x * this.halfWidth];
  }
  /** Nearest road coordinate for a world point: { s, lateral (in half-widths), d (world distance) }. */
  project(x, y) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < this.pos.length; i += 3) { const d = (this.pos[i][0] - x) ** 2 + (this.pos[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    for (let i = Math.max(0, best - 3); i <= Math.min(this.pos.length - 1, best + 3); i++) { const d = (this.pos[i][0] - x) ** 2 + (this.pos[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    const p = this.pos[best], t = this.tan[best];
    const dx = x - p[0], dy = y - p[1];
    const along = dx * t[0] + dy * t[1], across = dx * t[1] - dy * t[0];
    return { s: this.dist[best] - this.leadIn + along, lateral: across / this.halfWidth, d: Math.sqrt(bd) };
  }
  distanceToCenterline(px, py) { return this.project(px, py).d; }
  bounds() {
    let lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
    for (const q of this.pos) { lo = [Math.min(lo[0], q[0]), Math.min(lo[1], q[1])]; hi = [Math.max(hi[0], q[0]), Math.max(hi[1], q[1])]; }
    return { lo, hi };
  }
}

// ---- Level definitions ----------------------------------------------------------------------
const BUILD = {
  tower:    { name: 'Hero Tower', cost: 25, range: 7.5, fireInterval: 0.65, damage: 2 },
  wall:     { name: 'Palisade',   cost: 15, hp: 40 },
  farm:     { name: 'Farm',       cost: 10, income: 6 },
  barracks: { name: 'Barracks',   cost: 20, soldiers: 5 },
};
const ENEMY = {
  raider: { hp: 3, speed: 2.1, damage: 1, cooldown: 0.7, scale: 1 },
  brute:  { hp: 9, speed: 1.5, damage: 3, cooldown: 1.1, scale: 1.45 },
};
const KING = { speed: 5.2, hp: 12, damage: 3, cooldown: 0.45, range: 1.45 };
const SOLDIER = { hp: 4, speed: 3.8, damage: 1, cooldown: 0.6, range: 0.8, sight: 3.2 };

function makeLevel(n) {
  const lvl = Math.max(1, n);
  const seed = (Math.imul(lvl, 0x9E3779B1) + 0x5EED) >>> 0;
  const r = mulberry32(seed);
  const length = 54 + 4 * Math.min(lvl, 10);
  const track = new Track(seed, length);
  const keepGate = track.position(length), keepCenter = track.position(length + 3.4), plazaR = 5.8;
  const gateTan = track.tangent(length);
  const spots = [];
  let id = 1;
  const road = (type, s, x, cost) => spots.push({ id: id++, type, s, x, pos: track.point(s, x), cost, built: false, paid: 0 });
  const plaza = (type, angleDeg, radius, cost) => {
    const base = Math.atan2(gateTan[1], gateTan[0]), a = base + angleDeg * Math.PI / 180;
    spots.push({ id: id++, type, pos: [keepCenter[0] + Math.cos(a) * radius, keepCenter[1] + Math.sin(a) * radius], cost, built: false, paid: 0, s: Infinity });
  };
  road('tower', length - 7, -0.8, BUILD.tower.cost);
  road('wall', length - 11, 0, BUILD.wall.cost);
  plaza('farm', 240, 4.0, BUILD.farm.cost);
  plaza('barracks', 120, 4.0, BUILD.barracks.cost);
  if (lvl >= 2) { road('tower', length - 15, 0.8, BUILD.tower.cost); plaza('farm', 300, 4.2, BUILD.farm.cost); }
  if (lvl >= 3) { road('wall', length - 20, 0, BUILD.wall.cost + 5); road('tower', length - 24, -0.8, BUILD.tower.cost + 5); }
  if (lvl >= 4) { plaza('farm', 60, 4.2, BUILD.farm.cost + 5); }
  if (lvl >= 5) { road('tower', length - 30, 0.8, BUILD.tower.cost + 10); road('wall', length - 34, 0, BUILD.wall.cost + 10); }

  const waveCount = Math.min(5, 3 + Math.floor((lvl - 1) / 2));
  const waves = [];
  for (let w = 1; w <= waveCount; w++) {
    const raiders = 4 + 2 * w + 2 * (lvl - 1);
    const brutes = (w >= 3 || lvl >= 3) ? Math.max(1, Math.floor(raiders * 0.2)) : 0;
    waves.push({ raiders, brutes, spacing: Math.max(0.45, 0.9 - 0.05 * lvl) });
  }
  return {
    level: lvl, seed, length, track, keepGate, keepCenter, plazaR, spots, waves,
    startCoins: lvl === 1 ? 30 : 20 + 6 * lvl, income: 10 + 2 * lvl, dayLength: lvl === 1 ? 60 : 45,
    keepHp: 30, startSoldiers: lvl >= 2 ? 3 : 0,
    startPos: [keepGate[0] - gateTan[0] * 2.6, keepGate[1] - gateTan[1] * 2.6],
  };
}

// ---- World simulation ------------------------------------------------------------------------
class World {
  constructor(level) {
    this.level = level;
    this.t = 0;
    this.phase = 'day';            // day | night | won | lost
    this.day = 1; this.waveIndex = 0;
    this.dayTimer = level.dayLength;
    this.spots = level.spots.map(s => ({ ...s, hp: s.type === 'wall' ? BUILD.wall.hp : 0, cd: 0 }));
    this.keep = { hp: level.keepHp, maxHp: level.keepHp };
    const t = level.track.tangent(level.length);
    // The king starts inside the keep; the opening rides him out to `level.startPos`.
    this.king = { pos: level.keepCenter.slice(), facing: Math.atan2(-t[1], -t[0]), hp: KING.hp, cd: 0, down: 0, moving: false };
    this.path = [{ p: this.king.pos.slice(), d: 0 }];   // breadcrumb trail for the coins
    this.carried = level.startCoins;
    this.loose = []; this.flying = [];
    this.soldiers = []; this.enemies = []; this.queue = [];
    this.events = [];
    this.payTimer = 0; this.enemyId = 1; this.soldierId = 1;
    for (let i = 0; i < level.startSoldiers; i++) this.spawnSoldier();
  }
  emit(ev) { this.events.push(ev); }
  /** Moves the king without input (opening cinematic), keeping the coin trail behind him. */
  nudgeKing(p) {
    const k = this.king, last = this.path[this.path.length - 1], moved = dist(last.p, p);
    if (moved > 1e-4) k.facing = Math.atan2(p[1] - k.pos[1], p[0] - k.pos[0]);
    k.pos = p.slice();
    if (moved >= 0.1) { this.path.push({ p: p.slice(), d: last.d + moved }); if (this.path.length > 400) this.path.shift(); }
  }
  takeEvents() { const e = this.events; this.events = []; return e; }
  get finished() { return this.phase === 'won' || this.phase === 'lost'; }
  get wavesTotal() { return this.level.waves.length; }
  get enemiesLeft() { return this.queue.length + this.enemies.length; }

  // -- helpers
  clampWalkable(p) {
    const L = this.level, pr = L.track.project(p[0], p[1]);
    const inRoad = Math.abs(pr.lateral) <= 0.94 && pr.s >= -3 && pr.s <= L.length + 0.5;
    const dk = dist(p, L.keepCenter);
    if (inRoad || dk <= L.plazaR) return p;
    if (dk < L.plazaR + 2.5 && pr.s > L.length - 2) {
      const ux = (p[0] - L.keepCenter[0]) / dk, uy = (p[1] - L.keepCenter[1]) / dk;
      return [L.keepCenter[0] + ux * L.plazaR, L.keepCenter[1] + uy * L.plazaR];
    }
    return L.track.point(clamp(pr.s, -3, L.length + 0.5), clamp(pr.lateral, -0.94, 0.94));
  }
  enemyPos(e) { return this.level.track.point(Math.min(e.s, this.level.length + 1.3), e.lat); }
  nearestEnemy(p, range) {
    let best = null, bd = range;
    for (const e of this.enemies) { const d = dist(this.enemyPos(e), p); if (d < bd) { bd = d; best = e; } }
    return best;
  }
  spawnSoldier() {
    const k = this.king.pos;
    this.soldiers.push({ id: this.soldierId++, pos: [k[0] + (Math.random() - 0.5), k[1] - 1 + (Math.random() - 0.5)], hp: SOLDIER.hp, cd: 0, facing: this.king.facing, target: null });
  }
  dropCoin(p, n = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = 0.4 + Math.random() * 1.6;
      this.loose.push({ from: p.slice(), to: [p[0] + Math.cos(a) * d, p[1] + Math.sin(a) * d], t: 0, settle: 0.5 + Math.random() * 0.25 });
    }
  }

  // -- phases
  callNight() {
    if (this.phase !== 'day') return;
    this.phase = 'night'; this.waveIndex++;
    const w = this.level.waves[this.waveIndex - 1];
    let delay = 0.5;
    const list = [];
    for (let i = 0; i < w.raiders; i++) list.push('raider');
    for (let i = 0; i < w.brutes; i++) list.splice(2 + Math.floor(Math.random() * (list.length - 2)), 0, 'brute');
    for (const kind of list) { this.queue.push({ at: delay, kind, lat: rnd(Math.random, -0.65, 0.65) }); delay += w.spacing; }
    this.nightClock = 0;
    this.emit({ type: 'night', wave: this.waveIndex, total: this.wavesTotal });
  }
  morning() {
    this.phase = 'day'; this.day++; this.dayTimer = this.level.dayLength;
    this.king.hp = KING.hp; this.king.down = 0;
    for (const s of this.spots) if (s.type === 'wall' && s.built) s.hp = BUILD.wall.hp;
    let income = this.level.income;
    for (const s of this.spots) if (s.type === 'farm' && s.built) income += BUILD.farm.income;
    this.dropCoin(this.level.keepGate, income);

  game.shake = 0; game.intro = null; game.night = 0; game.tutorialStep = 0; game.movedDistance = 0;
  const r = mulberry32(level.seed ^ 0x7E44A1B2), t = level.track, b = t.bounds(), margin = 10;
  const clear = (x, y, extra) => t.distanceToCenterline(x, y) > t.halfWidth + WALL + extra && dist([x, y], level.keepCenter) > level.plazaR + 1.2 + extra;
  game.trees = []; game.tufts = []; game.rocks = [];
  for (let placed = 0, tries = 0; placed < 90 && tries < 600; tries++) {
    const x = rnd(r, b.lo[0] - margin, b.hi[0] + margin), y = rnd(r, b.lo[1] - margin, b.hi[1] + margin);
    if (!clear(x, y, 1.1)) continue;
    game.trees.push({ x, y, r: rnd(r, 0.5, 1.0), h: rnd(r, 0.5, 0.9) }); placed++;
  }
  for (let placed = 0, tries = 0; placed < 180 && tries < 700; tries++) {
    const x = rnd(r, b.lo[0] - margin, b.hi[0] + margin), y = rnd(r, b.lo[1] - margin, b.hi[1] + margin);
    if (!clear(x, y, 0.5)) continue;
    game.tufts.push({ x, y, r: rnd(r, 0.12, 0.3) }); placed++;
  }
  for (let placed = 0, tries = 0; placed < 20 && tries < 300; tries++) {
    const x = rnd(r, b.lo[0] - margin, b.hi[0] + margin), y = rnd(r, b.lo[1] - margin, b.hi[1] + margin);
    if (!clear(x, y, 1.0)) continue;
    game.rocks.push({ x, y, r: rnd(r, 0.3, 0.6) }); placed++;
  }
  game.pebbles = [];
  for (let s = -10; s < level.length; s += 1.1) { const p = t.point(s, rnd(r, -0.85, 0.85)); game.pebbles.push({ x: p[0], y: p[1], r: rnd(r, 0.05, 0.11) }); }
  game.cam = [game.world.king.pos[0], game.world.king.pos[1] - 2.2];
  updateHud();
}

// ---- Overlays / HUD -------------------------------------------------------------------------
function showTitle() {
  game.phase = 'title';
  panel.classList.remove('lost');
  panelTitle.textContent = 'KINGSHOT'; panelSub.textContent = 'Hold the Keep';
  panelMeta.textContent = 'Level ' + progress.level + ' · Best ' + progress.best + (progress.coins ? ' · ' + progress.coins + ' gold banked' : '');
  panelReward.hidden = true; panelButton.textContent = 'TAP TO PLAY'; panelButton.className = 'btn'; panelHelp.hidden = false;
  overlay.hidden = false; hudEl.classList.add('hide'); waveBtn.hidden = true;
}
function showResult(won, coins) {
  panel.classList.toggle('lost', !won);
  panelTitle.textContent = won ? 'VICTORY!' : 'THE KEEP FELL';
  panelSub.textContent = won ? 'Level ' + game.level.level + ' held' : 'Level ' + game.level.level + ' lost';
  panelMeta.textContent = won ? 'Every wave broke on your walls' : 'Wave ' + game.world.waveIndex + ' of ' + game.world.wavesTotal + ' got through';
  panelReward.hidden = !won; panelRewardText.textContent = '+' + coins;
  panelButton.textContent = won ? 'NEXT LEVEL' : 'TRY AGAIN'; panelButton.className = won ? 'btn' : 'btn retry'; panelHelp.hidden = true;
  overlay.hidden = false; waveBtn.hidden = true;
  panelButton.focus({ preventScroll: true });
}
function banner(html, cls, seconds) { bannerEl.innerHTML = html; bannerEl.className = 'show ' + (cls || ''); game.bannerUntil = game.time + seconds; }
function hint(text, seconds) { hintEl.textContent = text; hintEl.classList.add('show'); game.hintUntil = seconds ? game.time + seconds : Infinity; }
function hideHint() { hintEl.classList.remove('show'); game.hintUntil = 0; }
function updateHud() {
  const w = game.world; if (!w) return;
  coinCount.textContent = String(w.carried);
  dayLabel.textContent = w.phase === 'night' ? 'NIGHT ' + w.waveIndex : 'DAY ' + w.day;
  if (w.phase === 'night') { timerEl.textContent = 'Wave ' + w.waveIndex + ' of ' + w.wavesTotal + ' · ' + w.enemiesLeft + ' left'; timerEl.classList.add('night'); }
  else { const s = Math.max(0, Math.ceil(w.dayTimer)); timerEl.textContent = 'Night in ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); timerEl.classList.remove('night'); }
  keepFill.style.width = (100 * clamp(w.keep.hp / w.keep.maxHp, 0, 1)) + '%';
  waveBtn.hidden = !(game.phase === 'playing' && w.phase === 'day');
}

// Cinematic opening: pan up the raiders' road to the keep under a level banner, then the king
// rides out of the gate with his gold streaming behind him, then the first day begins.
const INTRO = { pan: 2.2, ride: 1.3, settle: 0.5 };
function beginIntro() {
  overlay.hidden = true;
  if (game.world.t > 0 || game.world.finished) loadLevel(progress.level);
  game.phase = 'intro';
  const L = game.level;
  const start = L.track.position(6);
  game.intro = { t: 0, from: start, to: L.keepGate.slice(), rideFrom: L.keepCenter.slice(), rideTo: L.startPos.slice(), goShown: false };
  game.cam = start.slice();
  banner('LEVEL ' + L.level + '<small>HOLD THE KEEP</small>', 'level', 2.0);
  audio.unlock(); audio.fanfare();
}
function finishIntro() {
  const L = game.level;
  game.intro = null; game.phase = 'playing';
  game.world.nudgeKing(L.startPos.slice());
  hudEl.classList.remove('hide');
  banner('DAY 1', 'day', 1.2);
  if (L.level === 1) { hint('Drag anywhere to march', 0); game.tutorialStep = 1; }
  else hint('Build fast. Night falls in ' + L.dayLength + ' seconds.', 3);
  updateHud();
}
function startGame(skipIntro) {
  if (game.phase === 'playing') return;
  if (skipIntro) { overlay.hidden = true; if (game.world.t > 0 || game.world.finished) loadLevel(progress.level); game.cam = game.level.startPos.slice(); audio.unlock(); finishIntro(); return; }
  beginIntro();

// ---- Synth ----------------------------------------------------------------------------------
const audio = {
  ctx: null,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.ctx = null; } },
  tone(freq, dur = 0.09, type = 'triangle', gain = 0.08, slide = 1.4, when = 0) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  },
  coin() { this.tone(1200 + Math.random() * 300, 0.07, 'triangle', 0.035, 1.3); },
  pay() { this.tone(900, 0.05, 'square', 0.02, 1.2); },
  built() { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.07, 1.0, i * 0.07)); },
  slash() { this.tone(300, 0.06, 'sawtooth', 0.025, 0.5); },
  hit() { this.tone(140, 0.05, 'square', 0.03, 0.8); },
  arrow() { this.tone(1800, 0.05, 'triangle', 0.02, 0.6); },
  die() { this.tone(220, 0.14, 'sawtooth', 0.03, 0.6); },
  keepHit() { this.tone(90, 0.25, 'square', 0.06, 0.7); },
  night() { [330, 262, 220].forEach((f, i) => this.tone(f, 0.4, 'sawtooth', 0.045, 0.98, i * 0.28)); },
  morning() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, 1.0, i * 0.12)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.08, 1.0, i * 0.11)); },
  lose() { [330, 262, 196].forEach((f, i) => this.tone(f, 0.24, 'sawtooth', 0.05, 0.9, i * 0.16)); },
  fanfare() { [[392, 0], [392, 0.14], [523, 0.28], [659, 0.5], [784, 0.75]].forEach(([f, w]) => this.tone(f, 0.26, 'sawtooth', 0.045, 1.0, w)); },
};

// ---- World events → animation --------------------------------------------------------------
function addText(text, x, y, color, size = 26, z = 1.2) { game.texts.push({ text, x, y, z, color, size, t: 0, life: 0.9 }); }
function spawnSparks(x, y, n, color = 'rgba(255,255,255,') {
  for (let i = 0; i < n; i++) game.sparks.push({ x: x + (Math.random() - 0.5) * 0.6, y: y + (Math.random() - 0.5) * 0.4, z: 0.3 + Math.random() * 0.4, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 1.5, vz: 1 + Math.random() * 2, t: 0, life: 0.3, color });
}
function handle(ev) {
  const w = game.world;
  switch (ev.type) {
    case 'pickup': audio.coin(); spawnSparks(ev.pos[0], ev.pos[1], 2, 'rgba(249,199,51,'); break;
    case 'pay': audio.pay(); break;
    case 'built': {
      audio.built(); addText(BUILD[ev.spot.type].name + ' built!', ev.spot.pos[0], ev.spot.pos[1], C.coin, 22, 1.6);
      spawnSparks(ev.spot.pos[0], ev.spot.pos[1], 10, 'rgba(249,199,51,');
      if (game.tutorialStep === 2) { game.tutorialStep = 3; hint('Towers shoot on their own. Walls hold the road. Build what you can, then call the night.', 6); }
      break;
    }
    case 'slash': game.slashes.push({ x: ev.pos[0], y: ev.pos[1], angle: ev.angle, t: 0, life: 0.18, small: !!ev.small }); if (!ev.small) audio.slash(); break;
    case 'arrow': game.arrows.push({ x0: ev.from[0], y0: ev.from[1], x1: ev.to[0], y1: ev.to[1], t: 0, life: 0.28 }); audio.arrow(); break;
    case 'hit': spawnSparks(ev.pos[0], ev.pos[1], 3, 'rgba(255,95,210,'); if (ev.what === 'king') { game.shake = Math.max(game.shake, 0.12); } audio.hit(); break;
    case 'enemyDied': game.puffs.push({ x: ev.pos[0], y: ev.pos[1], t: 0, life: 0.35, big: ev.kind === 'brute' }); spawnSparks(ev.pos[0], ev.pos[1], 4, 'rgba(255,95,210,'); audio.die(); break;
    case 'soldierDied': game.puffs.push({ x: ev.pos[0], y: ev.pos[1], t: 0, life: 0.35, red: true }); break;
    case 'wallBroken': spawnSparks(ev.spot.pos[0], ev.spot.pos[1], 14, 'rgba(140,92,46,'); game.shake = Math.max(game.shake, 0.25); addText('Palisade down!', ev.spot.pos[0], ev.spot.pos[1], '#ff6b5e', 22, 1.4); break;
    case 'keepHit': game.shake = Math.max(game.shake, 0.2); audio.keepHit(); spawnSparks(ev.pos[0], ev.pos[1], 3, 'rgba(255,120,80,'); break;
    case 'kingDown': banner('THE KING FALLS BACK<small>HE RETURNS IN 4 SECONDS</small>', 'night', 2.2); game.shake = 0.4; break;
    case 'night': banner('NIGHT ' + ev.wave + '<small>WAVE ' + ev.wave + ' OF ' + ev.total + '</small>', 'night', 2.2); audio.night(); if (game.tutorialStep > 0) { game.tutorialStep = 0; hint('Stay behind your wall. Your sword works too.', 4); } break;
    case 'morning': banner('DAY ' + ev.day + '<small>+' + ev.income + ' GOLD AT THE GATE</small>', 'day', 2.2); audio.morning(); break;
    case 'won': {
      game.phase = 'finished';
      const reward = ev.coins + 10 * game.level.level;
      progress.coins += reward; progress.level = game.level.level + 1; progress.best = Math.max(progress.best, progress.level); progress.save();
      banner('VICTORY', 'win', 1.6); audio.win();
      for (let i = 0; i < 40; i++) game.coinsFx.push({ x: w.king.pos[0], y: w.king.pos[1], z: 0.5, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 3, vz: 3 + Math.random() * 4, t: 0, life: 1.4 });
      game.pendingResult = 1.6; game.resultWon = true; game.resultCoins = reward;
      break;
    }
    case 'lost': game.phase = 'finished'; banner('THE KEEP FALLS', 'night', 1.6); audio.lose(); game.shake = 0.6; game.pendingResult = 1.4; game.resultWon = false; game.resultCoins = 0; break;
  }
}

// ---- Projection -----------------------------------------------------------------------------
function sx(x) { return game.w / 2 + (x - game.cam[0]) * game.ppu + game.shakeX; }
function sy(y, z = 0) { return game.h / 2 - (y - game.cam[1]) * game.ppu * TILT - z * game.ppu + game.shakeY; }
function onScreen(x, y, pad = 3) { const X = sx(x), Y = sy(y); return X > -pad * game.ppu && X < game.w + pad * game.ppu && Y > -pad * game.ppu && Y < game.h + pad * game.ppu; }
function drawStanding(sp, x, y, scale = 1, angle = null, alpha = 1, z = 0, stretch = 1) {
  const k = game.ppu / 36 * scale, w = sp.w * k, h = sp.h * k, X = sx(x), Y = sy(y, z);
  ctx.save();
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.translate(X, Y);
  if (angle !== null) ctx.rotate(-(angle - Math.PI / 2));
  ctx.scale(1 / Math.sqrt(stretch), stretch);
  ctx.drawImage(sp.canvas, -w / 2, -h, w, h);
  ctx.restore();
}
function groundShadow(x, y, rx, ry = rx * 0.5, alpha = 0.22) {
  ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
  ctx.beginPath(); ctx.ellipse(sx(x), sy(y), rx * game.ppu, ry * game.ppu * TILT, 0, 0, Math.PI * 2); ctx.fill();
}
function badge(text, x, y, z, size, fill = C.badge) {
  const X = sx(x), Y = sy(y, z), fs = size * game.ppu / 36;
  ctx.font = '900 ' + fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = Math.max(ctx.measureText(text).width + fs * 0.8, fs * 1.6), h = fs * 1.35;
  ctx.fillStyle = fill; rr(ctx, X - w / 2, Y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = C.white; ctx.fillText(text, X, Y + fs * 0.04);
}
function hpBar(x, y, z, frac, width = 1.4, color = '#4cc57f') {
  const X = sx(x), Y = sy(y, z), W = width * game.ppu, H = 0.16 * game.ppu;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, X - W / 2, Y - H / 2, W, H, H / 2); ctx.fill();
  ctx.fillStyle = color; rr(ctx, X - W / 2 + 1.5, Y - H / 2 + 1.5, Math.max(0, (W - 3) * clamp(frac, 0, 1)), H - 3, H / 2); ctx.fill();
}

// ---- Terrain ------------------------------------------------------------------------------
let visLo = 0, visHi = 0;
function updateVisibleRange(limit) {
  const pos = game.level.track.pos, half = game.h / 2 / (game.ppu * TILT) + CLIFF_H + 4;
  const yMin = game.cam[1] - half, yMax = game.cam[1] + half;
  let lo = 0, hi = limit;
  while (lo < hi) { const m = (lo + hi) >> 1; if (pos[m][1] < yMin) lo = m + 1; else hi = m; }
  visLo = Math.max(0, lo - 2);
  lo = visLo; hi = limit;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pos[m][1] > yMax) hi = m - 1; else lo = m; }
  visHi = Math.min(limit, lo + 2);
}
function tracePoly(a, b, dz) {
  ctx.moveTo(sx(a[visLo][0]), sy(a[visLo][1]) + dz);
  for (let i = visLo + 1; i <= visHi; i++) ctx.lineTo(sx(a[i][0]), sy(a[i][1]) + dz);
  for (let i = visHi; i >= visLo; i--) ctx.lineTo(sx(b[i][0]), sy(b[i][1]) + dz);
  ctx.closePath();
}
function traceLine(a, dz) { ctx.moveTo(sx(a[visLo][0]), sy(a[visLo][1]) + dz); for (let i = visLo + 1; i <= visHi; i++) ctx.lineTo(sx(a[i][0]), sy(a[i][1]) + dz); }
function drawTerrain() {
  const g = game.geo, L = game.level, lift = -CLIFF_H * game.ppu;
  ctx.fillStyle = C.grassLight;
  for (const tf of game.tufts) { if (!onScreen(tf.x, tf.y, 1)) continue; ctx.beginPath(); ctx.ellipse(sx(tf.x), sy(tf.y), tf.r * game.ppu, tf.r * game.ppu * 0.5, 0, 0, Math.PI * 2); ctx.fill(); }
  // Plaza in front of the keep
  const kc = L.keepCenter, R = L.plazaR * game.ppu;
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(sx(kc[0]) + 4, sy(kc[1]) + 6, R + 0.5 * game.ppu, (R + 0.5 * game.ppu) * TILT, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.cliffFace; ctx.beginPath(); ctx.ellipse(sx(kc[0]), sy(kc[1]), R + 0.45 * game.ppu, (R + 0.45 * game.ppu) * TILT, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.sand; ctx.beginPath(); ctx.ellipse(sx(kc[0]), sy(kc[1]), R, R * TILT, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.sandLight; ctx.beginPath(); ctx.ellipse(sx(kc[0]), sy(kc[1]), R * 0.6, R * 0.6 * TILT, 0, 0, Math.PI * 2); ctx.fill();
  // Road (sand) up to the plaza
  updateVisibleRange(g.roadEnd);
  ctx.fillStyle = C.sand; ctx.beginPath(); tracePoly(g.rl, g.rr, 0); ctx.fill();
  ctx.save(); ctx.beginPath(); tracePoly(g.rl, g.rr, 0); ctx.clip();
  ctx.strokeStyle = C.sandLight; ctx.lineWidth = L.track.halfWidth * 1.1 * game.ppu; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); traceLine(L.track.pos, 0); ctx.stroke();
  ctx.fillStyle = C.pebble;
  for (const p of game.pebbles) { if (!onScreen(p.x, p.y, 1)) continue; ctx.beginPath(); ctx.ellipse(sx(p.x), sy(p.y), p.r * game.ppu, p.r * game.ppu * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  // Cliffs flanking the road, stopping short of the plaza
  updateVisibleRange(g.cliffEnd);
  if (visHi > visLo) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); tracePoly(g.ol, g.or, 0.55 * game.ppu); tracePoly(g.rl, g.rr, 0.55 * game.ppu); ctx.fill('evenodd');
    ctx.fillStyle = C.cliffDark; ctx.beginPath(); tracePoly(g.ol, g.or, 0); tracePoly(g.rl, g.rr, 0); ctx.fill('evenodd');
    ctx.fillStyle = C.cliffFace; ctx.beginPath(); tracePoly(g.ol, g.or, lift * 0.45); tracePoly(g.rl, g.rr, lift * 0.45); ctx.fill('evenodd');
    ctx.fillStyle = C.cliff; ctx.beginPath(); tracePoly(g.ol, g.or, lift); tracePoly(g.rl, g.rr, lift); ctx.fill('evenodd');
    ctx.strokeStyle = C.cliffLight; ctx.lineWidth = 0.28 * game.ppu; ctx.lineJoin = 'round';
    ctx.beginPath(); traceLine(g.ol, lift + 0.14 * game.ppu); traceLine(g.rr, lift + 0.14 * game.ppu); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.18 * game.ppu;
    ctx.beginPath(); traceLine(g.or, lift - 0.08 * game.ppu); traceLine(g.rl, lift - 0.08 * game.ppu); ctx.stroke();
  }
  for (const rk of game.rocks) {
    if (!onScreen(rk.x, rk.y, 1)) continue;
    groundShadow(rk.x + 0.15, rk.y - 0.12, rk.r, rk.r * 0.6, 0.2);
    ctx.fillStyle = C.cliffFace; ctx.beginPath(); ctx.ellipse(sx(rk.x), sy(rk.y, rk.r * 0.3), rk.r * game.ppu, rk.r * game.ppu * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.cliffLight; ctx.beginPath(); ctx.ellipse(sx(rk.x) - rk.r * game.ppu * 0.2, sy(rk.y, rk.r * 0.45), rk.r * game.ppu * 0.55, rk.r * game.ppu * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function drawTree(tr) {
  const R = tr.r * game.ppu;
  groundShadow(tr.x + 0.35, tr.y - 0.25, tr.r * 0.9, tr.r * 0.55, 0.22);
  ctx.fillStyle = C.woodDark; ctx.fillRect(sx(tr.x) - 0.08 * game.ppu, sy(tr.y, tr.h * 0.6), 0.16 * game.ppu, tr.h * 0.6 * game.ppu);
  const cy = sy(tr.y, tr.h);
  ctx.fillStyle = C.treeDark; ctx.beginPath(); ctx.ellipse(sx(tr.x), cy + R * 0.15, R, R * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.grassDark; ctx.beginPath(); ctx.ellipse(sx(tr.x), cy, R * 0.95, R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.treeLight; ctx.beginPath(); ctx.ellipse(sx(tr.x) - R * 0.25, cy - R * 0.25, R * 0.5, R * 0.38, 0, 0, Math.PI * 2); ctx.fill();
}
function drawKeep() {
  const L = game.level, w = game.world, k = game.ppu / 36, kc = L.keepCenter, tan = L.track.tangent(L.length);
  const lift = 2.2 * game.ppu, W = 7.4 * game.ppu, D = 2.6 * game.ppu * TILT;
  ctx.save(); ctx.translate(sx(kc[0]), sy(kc[1])); ctx.rotate(-(Math.atan2(tan[1], tan[0]) - Math.PI / 2) * 0.55);
  groundShadowLocal(0.6 * game.ppu, 0.9 * game.ppu, W * 0.7, D * 0.9);
  // walls (front face)
  ctx.fillStyle = C.cliffDark; rr(ctx, -W / 2, -lift - D / 2 - 8 * k, W, lift + D + 16 * k, 8 * k); ctx.fill();
  ctx.fillStyle = C.cliffFace; rr(ctx, -W / 2 + 4 * k, -lift + D / 2 - 6 * k, W - 8 * k, lift - 6 * k, 6 * k); ctx.fill();
  // stonework lines
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2 * k;
  for (let i = 1; i < 4; i++) { const y = -lift + D / 2 + i * (lift - 10 * k) / 4; ctx.beginPath(); ctx.moveTo(-W / 2 + 8 * k, y); ctx.lineTo(W / 2 - 8 * k, y); ctx.stroke(); }
  // gate
  ctx.fillStyle = '#2b2f3a'; rr(ctx, -20 * k, -24 * k, 40 * k, 56 * k, [20 * k, 20 * k, 2, 2]); ctx.fill();
  ctx.fillStyle = C.woodDark; rr(ctx, -16 * k, -18 * k, 32 * k, 50 * k, [16 * k, 16 * k, 2, 2]); ctx.fill();
  ctx.fillStyle = C.wood; for (let i = 0; i < 3; i++) rr(ctx, -16 * k + i * 11 * k, -14 * k, 8 * k, 46 * k, 2 * k), ctx.fill();

}
canvas.addEventListener('pointerdown', ev => {
  if (game.phase === 'intro') { game.intro.t = Math.max(game.intro.t, INTRO.pan + INTRO.ride - 0.05); return; }
  if (game.phase !== 'playing') return;
  game.stick = { id: ev.pointerId, ox: ev.clientX, oy: ev.clientY, dx: 0, dy: 0 };
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', ev => {
  const s = game.stick; if (!s || s.id !== ev.pointerId) return;
  let dx = ev.clientX - s.ox, dy = ev.clientY - s.oy; const d = Math.hypot(dx, dy), max = 58;
  if (d > max) { s.ox += dx / d * (d - max); s.oy += dy / d * (d - max); dx = dx / d * max; dy = dy / d * max; }
  s.dx = dx / max; s.dy = dy / max;
});
const endStick = ev => { if (game.stick && game.stick.id === ev.pointerId) game.stick = null; };
canvas.addEventListener('pointerup', endStick); canvas.addEventListener('pointercancel', endStick);
window.addEventListener('keydown', ev => {
  game.keys[ev.key] = true;
  if (game.phase === 'intro') game.intro.t = Math.max(game.intro.t, INTRO.pan + INTRO.ride - 0.05);
  else if (game.phase === 'playing' && (ev.key === 'Enter' || ev.key === ' ') && game.world.phase === 'day') { ev.preventDefault(); waveBtn.click(); }
  else if (game.phase !== 'playing' && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); panelButton.click(); }
});
window.addEventListener('keyup', ev => { game.keys[ev.key] = false; });
window.addEventListener('blur', () => { game.keys = {}; game.stick = null; });
waveBtn.addEventListener('click', () => { if (game.phase === 'playing' && game.world.phase === 'day') { game.world.callNight(); hideHint(); updateHud(); } });
panelButton.addEventListener('click', () => { if (game.phase === 'finished') { loadLevel(progress.level); game.phase = 'title'; } startGame(false); });
overlay.addEventListener('click', ev => { if (ev.target === overlay && game.phase === 'title') startGame(false); });
window.addEventListener('resize', resize);

// ---- Tutorial beats (level 1) -------------------------------------------------------------------
function tutorial(dt, input) {
  if (game.tutorialStep === 1) {
    game.movedDistance += input.mag * KING.speed * dt;
    if (game.movedDistance > 4) { game.tutorialStep = 2; hint('Your gold follows you. Stand on a price sign to pay for it.', 0); }
  }
}

// ---- Autopilot (used by the tests; also a fair demo of the loop) -------------------------------
function autopilotInput() {
  const w = game.world, k = w.king.pos;
  let goal = null;
  if (w.phase === 'day') {
    const spot = w.spots.filter(s => !s.built).sort((a, b) => dist(a.pos, k) - dist(b.pos, k))[0];
    if (spot && w.carried > 0) goal = spot.pos;
    else if (w.loose.length) goal = w.loose.sort((a, b) => dist(a.to, k) - dist(b.to, k))[0].to;
    else if (w.dayTimer > 3) { w.callNight(); updateHud(); }
  } else {
    const wall = w.spots.find(s => s.type === 'wall' && s.built && s.hp > 0);
    goal = wall ? game.level.track.point(wall.s + 2.2, 0) : game.level.track.point(game.level.length - 2, 0);
    const e = w.nearestEnemy(k, 4);
    if (e && !wall) goal = w.enemyPos(e);
  }
  if (!goal) return { dir: [0, 0], mag: 0 };
  const d = dist(goal, k);
  if (d < 0.35) return { dir: [0, 0], mag: 0 };
  return { dir: [(goal[0] - k[0]) / d, (goal[1] - k[1]) / d], mag: Math.min(1, d) };
}

// ---- Frame ----------------------------------------------------------------------------------
function frame(now) {
  requestAnimationFrame(frame);
  const dt = game.lastT ? Math.min((now - game.lastT) / 1000, 1 / 30) : 1 / 60;
  game.lastT = now; game.time += dt;
  const w = game.world, L = game.level;

  if (game.intro) {
    const it = game.intro; it.t += dt;
    if (it.t < INTRO.pan) {
      const u = it.t / INTRO.pan, e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      game.cam = [lerp(it.from[0], it.to[0], e), lerp(it.from[1], it.to[1], e)];
    } else {
      const u = clamp((it.t - INTRO.pan) / INTRO.ride, 0, 1), e = 1 - Math.pow(1 - u, 3);
      w.nudgeKing([lerp(it.rideFrom[0], it.rideTo[0], e), lerp(it.rideFrom[1], it.rideTo[1], e)]);
      w.king.moving = u < 1;
      game.cam = [lerp(game.cam[0], w.king.pos[0], 1 - Math.exp(-dt * 4)), lerp(game.cam[1], w.king.pos[1], 1 - Math.exp(-dt * 4))];
    }
    if (it.t >= INTRO.pan + INTRO.ride + INTRO.settle) finishIntro();
  }
  if (game.phase === 'playing') {
    const input = game.autopilot ? autopilotInput() : readInput();
    for (let i = 0; i < (game.timeScale || 1) && game.phase === 'playing'; i++) { w.update(dt, game.autopilot ? autopilotInput() : input); for (const ev of w.takeEvents()) handle(ev); }
    tutorial(dt, input);
    const k = w.king, lead = k.moving ? 1.4 : 0;
    const target = [k.pos[0] + Math.cos(k.facing) * lead, k.pos[1] + Math.sin(k.facing) * lead - 2.2];
    const kk = 1 - Math.exp(-dt * 4);
    game.cam = [lerp(game.cam[0], target[0], kk), lerp(game.cam[1], target[1], kk)];
    game.hudTick = (game.hudTick || 0) + dt;
    if (game.hudTick > 0.2) { game.hudTick = 0; updateHud(); }
  } else if (w) {
    for (const ev of w.takeEvents()) handle(ev);
  }
  if (w) game.night = lerp(game.night, w.phase === 'night' ? 1 : 0, 1 - Math.exp(-dt * 1.5));
  if (game.pendingResult > 0) { game.pendingResult -= dt; if (game.pendingResult <= 0) showResult(game.resultWon, game.resultCoins); }
  if (game.bannerUntil && game.time >= game.bannerUntil) { bannerEl.className = ''; game.bannerUntil = 0; }
  if (game.hintUntil && game.time >= game.hintUntil) hideHint();
  game.shake = Math.max(0, game.shake - dt);
  const sh = game.shake * game.ppu * 0.25;
  game.shakeX = (Math.random() - 0.5) * sh; game.shakeY = (Math.random() - 0.5) * sh;

  ctx.fillStyle = C.grass; ctx.fillRect(0, 0, game.w, game.h);
  if (L) { drawTerrain(); drawActors(); drawEffects(dt); drawNight(); }
  drawVignette(); drawStick();
}

// ---- Boot -----------------------------------------------------------------------------------
progress.load();
resize();
loadLevel(progress.level);
showTitle();
requestAnimationFrame(frame);

window.__kingshot = {
  game, progress, makeLevel, World,
  start: (skipIntro = true) => { if (game.phase === 'finished') { loadLevel(progress.level); game.phase = 'title'; } startGame(skipIntro); },
  setAutopilot: (on) => { game.autopilot = !!on; },
  setLevel: (n) => { progress.level = n; loadLevel(n); showTitle(); },
  callNight: () => { if (game.world) { game.world.callNight(); updateHud(); } },
  setTimeScale: (n) => { game.timeScale = n; },
};
</script>

<title>Kingshot Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas carries the game; the DOM only holds the HUD strip and the
   title / result panels. Single committed look (a sunlit top-down map), same in any theme. */
:root {
  --grass: #29b06b;
  --sand: #e3cc9e;
  --cliff: #949caa;
  --ink: #141a26;
  --panel: rgba(20, 26, 38, 0.94);
  --gold: #f9c733;
  --red: #dc2f2f;
  --green: #2aa552;
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.78);
  --font-display: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--grass);
  color: var(--text);
  font-family: var(--font-display);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: fixed; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 18px; pointer-events: none;
  font-weight: 900; font-size: 22px; letter-spacing: 0.02em;
  text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 12px rgba(0,0,0,.25);
  font-variant-numeric: tabular-nums;
}
#coins { display: flex; align-items: center; gap: 8px; color: var(--gold); }
#coins svg { width: 22px; height: 22px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }

#hint {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
  text-align: center; font-weight: 800; font-size: 19px; pointer-events: none;
  text-shadow: 0 2px 0 rgba(0,0,0,.4);
  opacity: 0; transition: opacity .3s;
}
#hint.show { opacity: 1; }

#overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); padding: 16px;
}
#overlay[hidden] { display: none; }
.panel {
  width: min(340px, 100%); box-sizing: border-box;
  background: var(--panel); border: 4px solid var(--gold); border-radius: 24px;
  padding: 28px 22px 24px; text-align: center;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
}
.panel.lost { border-color: var(--red); }
.panel h1 {
  margin: 0 0 4px; font-size: 48px; font-weight: 900; line-height: 1; color: var(--gold);
  text-shadow: 0 3px 0 rgba(0,0,0,.5); text-wrap: balance; letter-spacing: .01em;
}
.panel.lost h1 { color: #ff6b5e; }
.panel .sub { margin: 0 0 18px; font-weight: 800; font-size: 20px; }
.panel .meta { margin: 0 0 18px; font-size: 16px; font-weight: 700; color: var(--text-dim); }
.panel .reward { display: flex; justify-content: center; align-items: center; gap: 8px;
  font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 18px; }
.panel .reward svg { width: 24px; height: 24px; }
.btn {
  appearance: none; border: 3px solid rgba(255,255,255,.85); border-radius: 16px;
  background: var(--green); color: #fff; font: inherit; font-weight: 900; font-size: 22px;
  letter-spacing: .03em; padding: 14px 32px; min-width: 220px; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.3); animation: pulse 1.1s ease-in-out infinite;
}
.btn.retry { background: #d94c3d; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.help { margin: 18px 0 0; font-size: 14px; font-weight: 700; color: var(--text-dim); line-height: 1.5; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
</style>

<canvas id="game" aria-label="Kingshot road game"></canvas>
<div id="hud">
  <div id="level">LEVEL 1</div>
  <div id="coins"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#cc8c1a"/><circle cx="10" cy="10" r="8" fill="#f9c733"/><circle cx="10" cy="10" r="4" fill="#cc8c1a"/><circle cx="10" cy="10" r="2.4" fill="#f9c733"/></svg><span id="coinCount">0</span></div>
</div>
<div id="hint" aria-live="polite">Drag to steer</div>
<div id="overlay">
  <div class="panel" id="panel" role="dialog" aria-labelledby="panelTitle">
    <h1 id="panelTitle">KINGSHOT</h1>
    <p class="sub" id="panelSub">Road to the Keep</p>
    <p class="meta" id="panelMeta">Level 1 · Best 1</p>
    <div class="reward" id="panelReward" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#cc8c1a"/><circle cx="10" cy="10" r="8" fill="#f9c733"/><circle cx="10" cy="10" r="4" fill="#cc8c1a"/><circle cx="10" cy="10" r="2.4" fill="#f9c733"/></svg><span id="panelRewardText">+0</span></div>
    <button class="btn" id="panelButton" type="button">TAP TO PLAY</button>
    <p class="help" id="panelHelp">Hold and drag to steer your army.<br>Take green gates, dodge red ones, outnumber the boss.</p>
  </div>
</div>

<script>
'use strict';
// =====================================================================================
//  Core rules — a straight port of Kingshot/Core (Swift). Track units along the road (s),
//  lateral position across it (x in -1..1). No rendering in this section.
// =====================================================================================

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = (r, lo, hi) => lo + (hi - lo) * r();
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const overlap = (aLo, aHi, bLo, bHi) => Math.max(aLo, bLo) < Math.min(aHi, bHi);

const LANE = {
  left:  { lo: -1, hi: 0, center: -0.5, width: 1 },
  right: { lo: 0, hi: 1, center: 0.5, width: 1 },
  full:  { lo: -1, hi: 1, center: 0, width: 2 },
};

const Op = {
  add: (n) => ({ k: 'add', n }), multiply: (n) => ({ k: 'mul', n }),
  subtract: (n) => ({ k: 'sub', n }), divide: (n) => ({ k: 'div', n }),
  apply(op, c) {
    switch (op.k) {
      case 'add': return Math.max(0, c + op.n);
      case 'mul': return Math.max(0, c * op.n);
      case 'sub': return Math.max(0, c - op.n);
      case 'div': return op.n <= 0 ? c : Math.max(0, Math.floor(c / op.n));
    }
    return c;
  },
  positive: (op) => op.k === 'add' || op.k === 'mul',
  label(op) { return { add: '+', mul: 'x', sub: '-', div: '÷' }[op.k] + op.n; },
};

const DEFAULTS = {
  forwardSpeed: 7.5, lateralSpeed: 3.5, engageDistance: 1.4, tradeInterval: 0.05,
  heroActivationFactor: 1.5, tickRate: 60,
};

// ---- Track geometry: Catmull-Rom spline through randomly turned control points ----------
class Track {
  constructor(seed, requiredLength, opts = {}) {
    const halfWidth = opts.halfWidth ?? 3, step = opts.step ?? 7, leadIn = opts.leadIn ?? 10;
    const tail = opts.tail ?? 14, straight = opts.straight ?? 2, per = opts.samplesPerSegment ?? 16;
    this.halfWidth = halfWidth; this.leadIn = leadIn;
    const r = mulberry32(seed ^ 0xC0FFEE);
    const segs = Math.ceil((leadIn + requiredLength + tail) / step) + 1;
    const pts = [[0, -step], [0, 0]];
    let p = [0, 0], heading = Math.PI / 2;
    const up = Math.PI / 2;
    for (let i = 0; i < segs; i++) {
      if (i >= straight) {
        const bias = (up - heading) * 0.35;
        heading = clamp(heading + rnd(r, -0.55, 0.55) + bias, up - 1.05, up + 1.05);
      }
      p = [p[0] + Math.cos(heading) * step, p[1] + Math.sin(heading) * step];
      pts.push(p);
    }
    pts.push([p[0] + Math.cos(heading) * step, p[1] + Math.sin(heading) * step]);
    this.controlPoints = pts;
    const pos = [], tan = [], dist = [];
    let run = 0;
    for (let seg = 1; seg <= pts.length - 3; seg++) {
      const [p0, p1, p2, p3] = [pts[seg - 1], pts[seg], pts[seg + 1], pts[seg + 2]];
      const steps = seg === pts.length - 3 ? per + 1 : per;
      for (let k = 0; k < steps; k++) {
        const t = k / per, t2 = t * t, t3 = t2 * t;
        const out = [0, 0], dir = [0, 0];
        for (let d = 0; d < 2; d++) {
          const a = 2 * p1[d], b = p2[d] - p0[d];
          const c = 2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d];
          const e = 3 * (p1[d] - p2[d]) - p0[d] + p3[d];
          out[d] = 0.5 * (a + b * t + c * t2 + e * t3);
          dir[d] = 0.5 * (b + 2 * c * t + 3 * e * t2);
        }
        if (pos.length) run += Math.hypot(out[0] - pos[pos.length - 1][0], out[1] - pos[pos.length - 1][1]);
        const len = Math.hypot(dir[0], dir[1]) || 1;
        pos.push(out); tan.push([dir[0] / len, dir[1] / len]); dist.push(run);
      }
    }
    this.pos = pos; this.tan = tan; this.dist = dist;
    this.total = run;
  }
  locate(s) {
    const d = clamp(s + this.leadIn, 0, this.total);
    let lo = 0, hi = this.dist.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (this.dist[mid] <= d) lo = mid; else hi = mid; }
    const span = this.dist[hi] - this.dist[lo];
    return [lo, span > 1e-9 ? clamp((d - this.dist[lo]) / span, 0, 1) : 0];
  }
  position(s) {
    const [i, f] = this.locate(s), a = this.pos[i], b = this.pos[Math.min(i + 1, this.pos.length - 1)];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  tangent(s) {
    const [i, f] = this.locate(s), a = this.tan[i], b = this.tan[Math.min(i + 1, this.tan.length - 1)];
    const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f, l = Math.hypot(x, y) || 1;
    return [x / l, y / l];
  }
  point(s, x) {
    const p = this.position(s), t = this.tangent(s);
    return [p[0] + t[1] * x * this.halfWidth, p[1] - t[0] * x * this.halfWidth];
  }
  distanceToCenterline(px, py) {
    let best = Infinity;
    for (const q of this.pos) { const d = Math.hypot(q[0] - px, q[1] - py); if (d < best) best = d; }
    return best;
  }
  bounds() {
    let lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
    for (const q of this.pos) { lo = [Math.min(lo[0], q[0]), Math.min(lo[1], q[1])]; hi = [Math.max(hi[0], q[0]), Math.max(hi[1], q[1])]; }
    return { lo, hi };
  }
}

// ---- Simulation --------------------------------------------------------------------------
class Simulation {
  constructor(level) {
    this.level = level;
    this.state = 'ready';
    this.crowdCount = level.startCount;
    this.crowdS = 0; this.crowdX = 0; this.targetX = 0; this.elapsed = 0;
    this.passed = new Set();
    this.engaged = null;
    this.enemyCounts = new Map(level.enemies.map(e => [e.id, e.count]));
    this.heroCooldowns = new Map(level.heroes.map(h => [h.id, h.fireInterval * 0.5]));
    this.tradeAcc = 0;
    Object.assign(this, { forwardSpeed: DEFAULTS.forwardSpeed, lateralSpeed: DEFAULTS.lateralSpeed,
      engageDistance: DEFAULTS.engageDistance, tradeInterval: DEFAULTS.tradeInterval });
  }
  get crowdHalfWidth() { return Math.min(0.5, 0.12 + 0.035 * Math.sqrt(Math.max(this.crowdCount, 1))); }
  get finished() { return this.state === 'won' || this.state === 'lost'; }
  enemyCount(id) { return this.enemyCounts.get(id) ?? 0; }
  start() { if (this.state === 'ready') this.state = 'running'; }
  update(dt) {
    const events = [];
    if (!(this.state === 'running' || this.state === 'fighting') || dt <= 0) return events;
    this.elapsed += dt;
    this.steer(dt);
    if (this.state === 'running') this.advance(dt, events);
    if (this.state === 'fighting') this.fight(dt, events);
    if (this.state === 'running' || this.state === 'fighting') this.updateHeroes(dt, events);
    return events;
  }
  steer(dt) {
    const lim = 1 - this.crowdHalfWidth, goal = clamp(this.targetX, -lim, lim);
    const d = goal - this.crowdX, step = this.lateralSpeed * dt;
    this.crowdX = Math.abs(d) <= step ? goal : this.crowdX + (d > 0 ? step : -step);
  }
  advance(dt, events) {
    const prev = this.crowdS;
    this.crowdS += this.forwardSpeed * dt;
    for (const g of this.level.gates) {
      if (this.passed.has(g.id) || !(g.s > prev && g.s <= this.crowdS)) continue;
      const inLane = g.lane === 'left' ? this.crowdX < 0 : g.lane === 'right' ? this.crowdX >= 0 : true;
      if (!inLane) continue;
      this.passed.add(g.id);
      const before = this.crowdCount;
      this.crowdCount = Op.apply(g.op, before);
      events.push({ type: 'gate', gateID: g.id, op: g.op, before, after: this.crowdCount });
      if (this.crowdCount <= 0) { this.lose(events); return; }
    }
    const hw = this.crowdHalfWidth, cLo = this.crowdX - hw, cHi = this.crowdX + hw;
    for (const e of this.level.enemies) {
      if (this.enemyCount(e.id) <= 0) continue;
      const gap = e.s - this.crowdS;
      if (!(gap <= this.engageDistance && gap > -this.engageDistance)) continue;
      if (!overlap(e.x - e.halfWidth, e.x + e.halfWidth, cLo, cHi)) continue;
      this.state = 'fighting'; this.engaged = e.id; this.tradeAcc = 0;
      this.crowdS = Math.min(this.crowdS, e.s - this.engageDistance * 0.6);
      events.push({ type: 'battle', enemyID: e.id });
      return;
    }
    if (this.crowdS >= this.level.length) this.win(events);
  }
  fight(dt, events) {
    const id = this.engaged;
    if (id == null) { this.state = 'running'; return; }
    this.tradeAcc += dt;
    while (this.tradeAcc >= this.tradeInterval && this.state === 'fighting') {
      this.tradeAcc -= this.tradeInterval;
      const left = this.enemyCount(id);
      if (left <= 0) { this.defeat(id, events); break; }
      const trade = Math.max(1, Math.floor(Math.min(this.crowdCount, left) / 12));
      const crowdLost = Math.min(trade, this.crowdCount), enemyLost = Math.min(trade, left);
      this.crowdCount -= crowdLost;
      this.enemyCounts.set(id, left - enemyLost);
      events.push({ type: 'trade', enemyID: id, crowdLost, enemyLost });
      if (this.crowdCount <= 0) { this.lose(events); return; }
      if (left - enemyLost <= 0) this.defeat(id, events);
    }
  }
  updateHeroes(dt, events) {
    for (const h of this.level.heroes) {
      if (Math.abs(h.s - this.crowdS) > h.range * DEFAULTS.heroActivationFactor) continue;
      let cd = (this.heroCooldowns.get(h.id) ?? 0) - dt;
      if (cd <= 0) {
        let target = null, best = Infinity;
        for (const e of this.level.enemies) {
          if (this.enemyCount(e.id) <= 0) continue;
          const d = Math.abs(e.s - h.s);
          if (d <= h.range && d < best) { best = d; target = e; }
        }
        if (target) {
          const left = this.enemyCount(target.id), dmg = Math.min(h.damage, left);
          this.enemyCounts.set(target.id, left - dmg);
          events.push({ type: 'hero', heroID: h.id, enemyID: target.id, damage: dmg });
          if (left - dmg <= 0) this.defeat(target.id, events);
          cd = h.fireInterval;
        } else cd = 0;
      }
      this.heroCooldowns.set(h.id, cd);
      if (this.finished) return;
    }
  }
  defeat(id, events) {
    this.enemyCounts.set(id, 0);
    events.push({ type: 'defeated', enemyID: id });
    if (this.engaged === id) { this.engaged = null; if (this.state === 'fighting') this.state = 'running'; }
    const e = this.level.enemies.find(e => e.id === id);
    if (e && e.isBoss) this.win(events);
  }
  win(events) { if (this.finished) return; this.state = 'won'; this.engaged = null; events.push({ type: 'won', survivors: this.crowdCount }); }
  lose(events) { if (this.finished) return; this.state = 'lost'; this.engaged = null; this.crowdCount = 0; events.push({ type: 'lost' }); }
}

// ---- Greedy pilot: the baseline player used to size levels ------------------------------
const Pilot = {
  steer(sim) {
    let nextS = Infinity;
    for (const g of sim.level.gates) if (g.s > sim.crowdS && !sim.passed.has(g.id)) nextS = Math.min(nextS, g.s);
    if (nextS === Infinity) { sim.targetX = 0; return; }
    let bestLane = 'full', bestOut = -Infinity;
    for (const g of sim.level.gates) if (g.s === nextS) {
      const out = Op.apply(g.op, sim.crowdCount);
      if (out > bestOut) { bestOut = out; bestLane = g.lane; }
    }
    sim.targetX = LANE[bestLane].center;
  },
  playThrough(level, maxTicks = 60000) {
    const sim = new Simulation(level); sim.start();
    const dt = 1 / DEFAULTS.tickRate;
    for (let t = 0; !sim.finished && t < maxTicks; t++) { Pilot.steer(sim); sim.update(dt); }
    return { state: sim.state, survivors: sim.state === 'won' ? sim.crowdCount : 0 };
  },
};

// ---- Level generator ----------------------------------------------------------------------
const Gen = {
  heroRange: 8, heroFireInterval: 0.45, heroAmbushGap: 6,
  startCount: (lvl) => Math.min(60, 10 + 2 * (Math.max(1, lvl) - 1)),
  round5: (v) => Math.max(5, Math.round(v / 5) * 5),
  recoveryBonus: (lvl) => Gen.round5(12 + lvl * 3),
  expectedHeroKills(damage) {
    const window = (Gen.heroRange * DEFAULTS.heroActivationFactor + Gen.heroAmbushGap - DEFAULTS.engageDistance) / DEFAULTS.forwardSpeed;
    const shots = Math.floor((window - Gen.heroFireInterval * 0.5) / Gen.heroFireInterval) + 2;
    return Math.max(0, shots) * damage;
  },
  make(level) {
    const lvl = Math.max(1, level);
    const seed = (Math.imul(lvl, 0x9E3779B1) + 0x5EED) >>> 0;
    const r = mulberry32(seed);
    const length = 80 + 8 * Math.min(lvl, 25);
    const start = Gen.startCount(lvl);
    const cap = 80 + 40 * lvl;
    const track = new Track(seed, length);
    let gates = [], enemies = [], heroes = [], nextID = 1;
    const id = () => nextID++;
    const spec = (len) => ({ level: lvl, seed, length: len, startCount: start, gates, enemies, heroes, track });
    const measure = (end) => Pilot.playThrough(spec(end)).survivors;
    const buff = (hc, lo, hi) => {
      if (hc * 2 <= cap && r() < 0.5) {
        const triple = lvl >= 6 && hc * 3 <= cap && r() < 0.25;
        return Op.multiply(triple ? 3 : 2);
      }
      return Op.add(Gen.round5(Math.max(5, Math.min(hc, cap) * rnd(r, lo, hi))));
    };
    let hc = start, s = 16, seg = 0;
    while (s < length - 22) {
      const roll = seg === 0 ? 0 : r();
      const snap = { gates: gates.slice(), enemies: enemies.slice(), heroes: heroes.slice(), s };
      if (roll < 0.42) {
        let left, right;
        const flavour = seg === 0 ? 0 : r();
        if (flavour < 0.55) {
          left = Op.add(Gen.round5(Math.max(5, Math.min(hc, cap) * rnd(r, 0.4, 0.7))));
          right = buff(hc, 0.9, 1.4);
        } else {
          const trap = r() < 0.5 ? Op.subtract(Gen.round5(hc * 0.5)) : Op.divide(2);
          left = buff(hc, 0.6, 1.1); right = trap;
        }
        if (r() < 0.5) [left, right] = [right, left];
        gates.push({ id: id(), s, lane: 'left', op: left });
        gates.push({ id: id(), s, lane: 'right', op: right });
      } else if (roll < 0.72) {
        const count = Math.max(3, Math.floor(hc * rnd(r, 0.25, 0.5)));
        const full = r() < 0.35;
        const x = full ? 0 : (r() < 0.5 ? -0.5 : 0.5);
        enemies.push({ id: id(), s, x, halfWidth: full ? 1 : 0.5, count, isBoss: false });
      } else if (roll < 0.88) {
        s += 2;
        const side = r() < 0.5 ? -1 : 1;
        const damage = 2 + Math.floor(lvl / 3);
        heroes.push({ id: id(), s, side, range: Gen.heroRange, damage, fireInterval: Gen.heroFireInterval });
        const contact = Math.max(4, Math.floor(hc * rnd(r, 0.3, 0.5)));
        enemies.push({ id: id(), s: s + Gen.heroAmbushGap, x: 0, halfWidth: 1, count: contact + Gen.expectedHeroKills(damage), isBoss: false });
        s += Gen.heroAmbushGap;
      } else {
        gates.push({ id: id(), s, lane: 'full', op: buff(hc, 0.6, 1.0) });
      }
      hc = measure(s + 8);
      if (hc <= 0) {
        ({ gates, enemies, heroes, s } = snap);
        gates.push({ id: id(), s, lane: 'full', op: Op.add(Gen.recoveryBonus(lvl)) });
        hc = measure(s + 8);
      }
      for (let rec = 0; hc < 15 && rec < 3; rec++) {
        s += 7;
        gates.push({ id: id(), s, lane: 'full', op: Op.add(Gen.recoveryBonus(lvl)) });
        hc = measure(s + 8);
      }
      s += rnd(r, 9, 12); seg++;
    }
    for (let rec = 0; hc < 20 && rec < 3; rec++) {
      gates.push({ id: id(), s, lane: 'full', op: Op.add(Gen.recoveryBonus(lvl)) });
      hc = measure(s + 8); s += 7;
    }
    const bossCount = Math.max(5, Math.floor(hc * rnd(r, 0.6, 0.85)));

// ---- Game state ---------------------------------------------------------------------------
const game = {
  phase: 'title', level: null, sim: null, ppu: 36, cam: [0, 0], lastT: 0, time: 0,
  trees: [], crowdPhases: [], effects: [], texts: [], arrows: [], gateAnim: new Map(), enemyVisible: new Map(),
  coinsEarned: 0, pendingResult: 0, autopilot: false, dragging: false, dragStartX: 0, dragStartTarget: 0,
  celebrate: false,
};

const UNIT_SCALE = 1.4;
const CROWD_SPACING = 0.2, CROWD_MAX = 110, ENEMY_SPACING = 0.34, ENEMY_MAX = 60;
const WALL = 1.15;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  game.w = w; game.h = h;
  game.ppu = Math.min(w / 13.5, 44);
  buildSprites();
}

function loadLevel(n) {
  const level = Gen.make(n);
  game.level = level; game.sim = new Simulation(level);
  game.effects = []; game.texts = []; game.arrows = []; game.gateAnim = new Map(); game.enemyVisible = new Map();
  game.coinsEarned = 0; game.pendingResult = 0; game.celebrate = false;
  game.crowdPhases = Array.from({ length: CROWD_MAX }, () => Math.random() * Math.PI * 2);
  // Trees: scattered on the grass, clear of the road and its cliffs.
  const r = mulberry32(level.seed ^ 0x7E44A1B2);
  const b = level.track.bounds(), margin = 9, clearance = level.track.halfWidth + WALL + 1;
  game.trees = [];
  for (let placed = 0, tries = 0; placed < 70 && tries < 400; tries++) {
    const x = rnd(r, b.lo[0] - margin, b.hi[0] + margin), y = rnd(r, b.lo[1] - margin, b.hi[1] + margin);
    if (level.track.distanceToCenterline(x, y) <= clearance) continue;
    game.trees.push({ x, y, r: rnd(r, 0.45, 0.95) }); placed++;
  }
  game.cam = cameraTarget();
  hudLevel.textContent = 'LEVEL ' + n;
  hudCoins.textContent = String(progress.coins);
}

function cameraTarget() {
  const p = game.level.track.position(game.sim.crowdS + 4.5);
  return [p[0], p[1]];
}

function showTitle() {

  panelTitle.textContent = 'KINGSHOT';

// ---- Tiny synth for feedback (starts only after a tap) -----------------------------------
const audio = {
  ctx: null,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.ctx = null; } },
  blip(freq, dur = 0.09, type = 'triangle', gain = 0.08) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.4, t + dur);
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* ignore */ }
  },
  good() { this.blip(660); setTimeout(() => this.blip(880), 60); },
  bad() { this.blip(220, 0.18, 'sawtooth', 0.05); },
  hit() { this.blip(140, 0.05, 'square', 0.03); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, 0.16), i * 110)); },
  lose() { [330, 262, 196].forEach((f, i) => setTimeout(() => this.blip(f, 0.22, 'sawtooth', 0.05), i * 160)); },
};

// ---- Events from the simulation become animation ------------------------------------------
function worldOf(s, x) { return game.level.track.point(s, x); }
function addText(text, x, y, color, size = 30) { game.texts.push({ text, x, y, color, size, t: 0, life: 0.9 }); }
function spawnLosses(fromX, fromY, radius, count, sprite) {
  for (let i = 0; i < Math.min(count, 12); i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * radius;
    game.effects.push({ x: fromX + Math.cos(a) * d, y: fromY + Math.sin(a) * d, vx: (Math.random() - 0.5) * 1.2, vy: 0.4 + Math.random() * 0.7, t: 0, life: 0.3, sprite });
  }
}
function handle(ev) {
  const sim = game.sim, level = game.level;
  const crowdPos = worldOf(sim.crowdS, sim.crowdX);
  switch (ev.type) {
    case 'gate': {
      game.gateAnim.set(ev.gateID, 0);
      const good = Op.positive(ev.op);
      addText(Op.label(ev.op), crowdPos[0], crowdPos[1] + crowdRadius() + 2.0, good ? C.coin : '#ff6b5e');
      if (!good) spawnLosses(crowdPos[0], crowdPos[1], crowdRadius(), ev.before - ev.after, 'crowd');
      good ? audio.good() : audio.bad();
      break;
    }
    case 'battle': audio.hit(); break;
    case 'trade': {
      const e = level.enemies.find(e => e.id === ev.enemyID), ep = worldOf(e.s, e.x);
      spawnLosses(crowdPos[0], crowdPos[1], crowdRadius() * 0.8, ev.crowdLost, 'crowd');
      spawnLosses(ep[0], ep[1], 0.6, ev.enemyLost, 'enemy');
      if (Math.random() < 0.3) audio.hit();
      break;
    }
    case 'hero': {
      const h = level.heroes.find(h => h.id === ev.heroID), e = level.enemies.find(e => e.id === ev.enemyID);
      const from = worldOf(h.s, h.side * 1.5), to = worldOf(e.s, e.x);
      game.arrows.push({ x0: from[0], y0: from[1] + 0.9, x1: to[0], y1: to[1], t: 0, life: Math.min(0.35, Math.hypot(to[0] - from[0], to[1] - from[1]) / 25) });
      spawnLosses(to[0], to[1], 0.5, ev.damage, 'enemy');
      break;
    }
    case 'defeated': {
      const e = level.enemies.find(e => e.id === ev.enemyID), ep = worldOf(e.s, e.x);
      const reward = Math.max(1, Math.floor(e.count / 2));
      game.coinsEarned += reward;
      addText('+' + reward, ep[0], ep[1] + 0.8, C.coin, 24);
      break;
    }
    case 'won': {
      game.phase = 'finished'; game.celebrate = true;
      game.coinsEarned += ev.survivors + 5 * level.level;
      progress.coins += game.coinsEarned; progress.level = level.level + 1; progress.best = Math.max(progress.best, progress.level);
      progress.save(); hudCoins.textContent = String(progress.coins);
      audio.win();
      game.pendingResult = 1.2; game.resultWon = true; game.resultSurvivors = ev.survivors;
      break;
    }
    case 'lost': {
      game.phase = 'finished';
      spawnLosses(crowdPos[0], crowdPos[1], crowdRadius(), 12, 'crowd');
      audio.lose();
      game.pendingResult = 1.0; game.resultWon = false; game.resultSurvivors = 0;
      break;
    }
  }
}

// ---- Rendering ----------------------------------------------------------------------------
function sx(x) { return game.w / 2 + (x - game.cam[0]) * game.ppu; }
function sy(y) { return game.h / 2 - (y - game.cam[1]) * game.ppu; }

function drawSprite(sp, x, y, scale = 1, alpha = 1) {
  const k = game.ppu / 36 * scale, w = sp.w * k, h = sp.h * k;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(sp.canvas, sx(x) - w / 2, sy(y) - h / 2, w, h);
  if (alpha !== 1) ctx.globalAlpha = 1;
}
function badge(text, x, y, size, fill = C.badge) {
  const px = sx(x), py = sy(y), fs = size * game.ppu / 36;
  ctx.font = '900 ' + fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = Math.max(ctx.measureText(text).width + fs * 0.8, fs * 1.6), h = fs * 1.35;
  ctx.fillStyle = fill; roundRect(ctx, px - w / 2, py - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = C.white; ctx.fillText(text, px, py + fs * 0.04);
}
function strokeRoad(color, widthUnits, dx = 0, dy = 0) {
  const t = game.level.track;
  ctx.beginPath();

    const x = sx(t.pos[i][0]) + dx, y = sy(t.pos[i][1]) + dy;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);

}

  const t = game.level.track, road = t.halfWidth * 2, wall = road + WALL * 2;
  strokeRoad(C.shadow, wall + 0.4, 10 * game.ppu / 36, 14 * game.ppu / 36);
  strokeRoad(C.cliffDark, wall + 0.17);
  strokeRoad(C.cliff, wall);
  strokeRoad(C.cliffLight, wall - WALL * 0.9);
  strokeRoad(C.sand, road);
  strokeRoad('rgba(237,219,181,0.55)', road * 0.55);
  // Trees
  for (const tr of game.trees) {
    const px = sx(tr.x), py = sy(tr.y), rr = tr.r * game.ppu;
    if (px < -rr || px > game.w + rr || py < -rr || py > game.h + rr) continue;
    ctx.fillStyle = C.shadow; ctx.beginPath(); ctx.arc(px + 5, py + 6, rr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.grassDark; ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.treeLight; ctx.beginPath(); ctx.arc(px - rr * 0.25, py - rr * 0.25, rr * 0.55, 0, Math.PI * 2); ctx.fill();
  }
  // Lumber camp near the start
  const cp = t.point(-5, 2.4), cx = sx(cp[0]), cy = sy(cp[1]), k = game.ppu / 36;
  ctx.fillStyle = C.shadow; roundRect(ctx, cx - 36 * k, cy - 26 * k, 80 * k, 60 * k, 8 * k); ctx.fill();
  ctx.fillStyle = C.woodDark; roundRect(ctx, cx - 40 * k, cy - 32 * k, 80 * k, 60 * k, 8 * k); ctx.fill();
  ctx.fillStyle = C.wood;
  for (let i = 0; i < 5; i++) { roundRect(ctx, cx - 36 * k, cy - 28 * k + i * 11 * k, 72 * k, 8 * k, 2 * k); ctx.fill(); }
  ctx.fillStyle = C.woodDark;
  for (const [dx, dy] of [[-32, -24], [32, -24], [-32, 20], [32, 20]]) { ctx.beginPath(); ctx.arc(cx + dx * k, cy + dy * k, 5 * k, 0, Math.PI * 2); ctx.fill(); }
  // Keep behind the boss
  const s = game.level.length - 1, kp = t.position(s), tan = t.tangent(s);
  ctx.save(); ctx.translate(sx(kp[0]), sy(kp[1])); ctx.rotate(-(Math.atan2(tan[1], tan[0]) - Math.PI / 2));
  const kw = road * game.ppu + 20 * k;
  ctx.fillStyle = C.cliffDark; ctx.strokeStyle = C.cliff; ctx.lineWidth = 4 * k;
  roundRect(ctx, -kw / 2, -50 * k, kw, 70 * k, 10 * k); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.cliff;
  const merlons = Math.floor(kw / (28 * k));
  for (let i = 0; i < merlons; i++) { const mx = -kw / 2 + 14 * k + i * 28 * k; roundRect(ctx, mx - 8 * k, -62 * k, 16 * k, 16 * k, 3 * k); ctx.fill(); }

function drawGates() {
  const t = game.level.track, k = game.ppu / 36;
  for (const g of game.level.gates) {
    const anim = game.gateAnim.get(g.id);
    if (anim !== undefined && anim >= 0.33) continue;
    const lane = LANE[g.lane];
    const p = t.point(g.s, lane.center), tan = t.tangent(g.s);
    const px = sx(p[0]), py = sy(p[1]);
    if (px < -200 || px > game.w + 200 || py < -200 || py > game.h + 200) continue;
    const w = (t.halfWidth * lane.width * game.ppu) - 12 * k, h = 46 * k;
    const good = Op.positive(g.op);

    ctx.save(); ctx.translate(px, py); ctx.rotate(-(Math.atan2(tan[1], tan[0]) - Math.PI / 2)); ctx.scale(scale, scale);
    ctx.fillStyle = anim !== undefined && anim < 0.05 ? '#fff' : (good ? C.gateGood : C.gateBad);

}
function drawHeroes() {
  for (const h of game.level.heroes) {
    const p = worldOf(h.s, h.side * 1.5);
    if (Math.abs(sx(p[0]) - game.w / 2) > game.w || Math.abs(sy(p[1]) - game.h / 2) > game.h) continue;
    drawSprite(sprites.pedestal, p[0], p[1]);

}

    const p = t.point(e.s, e.x), tan = t.tangent(e.s), right = [tan[1], -tan[0]];
    if (Math.abs(sx(p[0]) - game.w / 2) > game.w || Math.abs(sy(p[1]) - game.h / 2) > game.h) continue;
    const maxCols = Math.floor((t.halfWidth * e.halfWidth * 2 - 0.3) / ENEMY_SPACING);

      ctx.save(); ctx.translate(sx(p[0]), sy(p[1])); ctx.rotate(-(Math.atan2(tan[1], tan[0]) - Math.PI / 2));
      const pw = (t.halfWidth * 2) * game.ppu - 8, k = game.ppu / 36;
      ctx.fillStyle = 'rgba(107,115,128,0.35)'; ctx.strokeStyle = 'rgba(107,115,128,0.6)'; ctx.lineWidth = 3 * k;
      roundRect(ctx, -pw / 2, -80 * k, pw, 110 * k, 14 * k); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    for (let i = visible - 1; i >= 0; i--) {
      const col = i % cols, row = Math.floor(i / cols);
      const across = (col - (cols - 1) / 2) * ENEMY_SPACING, back = row * ENEMY_SPACING;
      drawSprite(sprites.enemy, p[0] + right[0] * across + tan[0] * back, p[1] + right[1] * across + tan[1] * back, UNIT_SCALE * (e.isBoss ? 1.15 : 1));
    }
    const depth = Math.ceil(visible / cols) * ENEMY_SPACING;
    badge(e.isBoss ? 'BOSS ' + count : String(count), p[0] + tan[0] * depth * 0.5, p[1] + tan[1] * depth * 0.5 + depth * 0.5 + 0.75,
      e.isBoss ? 26 : 20, e.isBoss ? 'rgba(140,26,26,0.85)' : C.badge);
  }
}
function drawCrowd() {
  const sim = game.sim, p = worldOf(sim.crowdS, sim.crowdX);
  const n = Math.min(sim.crowdCount, CROWD_MAX);
  const order = [];
  for (let i = 0; i < n; i++) {
    const r = CROWD_SPACING * Math.sqrt(i), a = i * GOLDEN;
    let dy = Math.sin(game.time * 14 + game.crowdPhases[i]) * 0.045;
    if (game.celebrate) dy += Math.abs(Math.sin(game.time * 8 + (i % 10) * 0.5)) * 0.4;
    order.push([p[0] + r * Math.cos(a), p[1] + r * Math.sin(a) + dy, r * Math.sin(a)]);
  }
  order.sort((u, v) => v[2] - u[2]);
  for (const u of order) drawSprite(sprites.crowd, u[0], u[1], UNIT_SCALE);
  if (sim.crowdCount > 0) badge(String(sim.crowdCount), p[0], p[1] + crowdRadius() + 0.5, 22);
}
function drawEffects(dt) {
  game.effects = game.effects.filter(f => (f.t += dt) < f.life);
  for (const f of game.effects) {
    const u = f.t / f.life;
    drawSprite(sprites[f.sprite], f.x + f.vx * u, f.y + f.vy * u, UNIT_SCALE * (1 - u * 0.6), 1 - u);
  }
  game.arrows = game.arrows.filter(a => (a.t += dt) < a.life + 0.05);
  const k = game.ppu / 36;
  for (const a of game.arrows) {
    const u = Math.min(1, a.t / a.life), x = a.x0 + (a.x1 - a.x0) * u, y = a.y0 + (a.y1 - a.y0) * u;
    const ang = Math.atan2(a.y1 - a.y0, a.x1 - a.x0);
    ctx.save(); ctx.translate(sx(x), sy(y)); ctx.rotate(-ang);
    ctx.strokeStyle = C.woodDark; ctx.lineWidth = 3 * k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9 * k, 0); ctx.lineTo(9 * k, 0); ctx.stroke();
    ctx.fillStyle = C.steel; ctx.beginPath(); ctx.arc(9 * k, 0, 2.5 * k, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  game.texts = game.texts.filter(t => (t.t += dt) < t.life);
  for (const t of game.texts) {
    const u = t.t / t.life, rise = 1.9 * (1 - Math.pow(1 - u, 2)), pop = Math.min(1, t.t / 0.12);
    const fs = t.size * k * (0.6 + 0.4 * pop);
    ctx.globalAlpha = u < 0.5 ? 1 : 1 - (u - 0.5) * 2;
    ctx.font = '900 ' + fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(t.text, sx(t.x) + 2, sy(t.y + rise) + 2);
    ctx.fillStyle = t.color; ctx.fillText(t.text, sx(t.x), sy(t.y + rise));
    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = game.lastT ? Math.min((now - game.lastT) / 1000, 1 / 30) : 1 / 60;
  game.lastT = now; game.time += dt;
  if (game.phase === 'playing') {
    if (game.autopilot) Pilot.steer(game.sim);
    for (const ev of game.sim.update(dt)) handle(ev);
    const target = cameraTarget(), kk = 1 - Math.exp(-dt * 5);
    game.cam = [game.cam[0] + (target[0] - game.cam[0]) * kk, game.cam[1] + (target[1] - game.cam[1]) * kk];
  }
  if (game.pendingResult > 0) {
    game.pendingResult -= dt;
    if (game.pendingResult <= 0) showResult(game.resultWon, game.resultSurvivors, game.coinsEarned);
  }
  ctx.fillStyle = C.grass; ctx.fillRect(0, 0, game.w, game.h);
  drawTerrain(); drawGates(); drawHeroes(); drawEnemies(); drawCrowd(); drawEffects(dt);
  for (const [id, t] of game.gateAnim) game.gateAnim.set(id, t + dt);
}

// ---- Input ----------------------------------------------------------------------------------
canvas.addEventListener('pointerdown', ev => {
  if (game.phase !== 'playing') return;
  game.dragging = true; game.dragStartX = ev.clientX; game.dragStartTarget = game.sim.targetX;
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', ev => {
  if (!game.dragging || game.phase !== 'playing') return;
  const delta = (ev.clientX - game.dragStartX) / (game.ppu * 3.3);
  game.sim.targetX = clamp(game.dragStartTarget + delta, -1, 1);
});
const endDrag = () => { game.dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', ev => {
  if (game.phase === 'playing') {
    if (ev.key === 'ArrowLeft' || ev.key === 'a') game.sim.targetX = -0.5;
    if (ev.key === 'ArrowRight' || ev.key === 'd') game.sim.targetX = 0.5;
    if (ev.key === 'ArrowDown' || ev.key === 's') game.sim.targetX = 0;
  } else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); panelButton.click(); }
});
panelButton.addEventListener('click', () => {
  if (game.phase === 'finished') { loadLevel(progress.level); game.phase = 'title'; }
  startGame();
});
overlay.addEventListener('click', ev => { if (ev.target === overlay && game.phase === 'title') startGame(); });
window.addEventListener('resize', resize);

// ---- Boot -----------------------------------------------------------------------------------
progress.load();
resize();
loadLevel(progress.level);
showTitle();
requestAnimationFrame(frame);

// Test / automation hooks.
window.__kingshot = {
  game, progress, Gen, Pilot, Simulation,
  start: () => { if (game.phase !== 'playing') panelButton.click(); },
  setAutopilot: (on) => { game.autopilot = !!on; },
  setLevel: (n) => { progress.level = n; loadLevel(n); showTitle(); },
};
</script>
